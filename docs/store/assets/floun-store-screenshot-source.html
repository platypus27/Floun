<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floun Chrome Web Store artwork</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body {
        background: #f8f7f2 url("./floun-store-background.png") center / cover no-repeat;
        color: #123f47;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 470px 1fr;
        gap: 54px;
        height: 100%;
        padding: 78px 74px;
      }
      .copy { align-self: center; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 38px; }
      .brand img { width: 56px; height: 56px; }
      .brand span { color: #16707a; font-size: 34px; font-weight: 700; letter-spacing: -1px; }
      .version {
        display: inline-block;
        margin-bottom: 20px;
        border: 1px solid #d7a33d;
        border-radius: 999px;
        padding: 7px 13px;
        background: rgba(255, 255, 255, 0.72);
        color: #775718;
        font-size: 14px;
        font-weight: 700;
      }
      h1 { margin: 0; font-size: 48px; line-height: 1.08; letter-spacing: -1.8px; }
      p { margin: 24px 0 28px; color: #345d63; font-size: 20px; line-height: 1.5; }
      ul { margin: 0; padding: 0; list-style: none; color: #234f56; font-size: 17px; line-height: 1.7; }
      li::before { content: "✓"; margin-right: 12px; color: #16707a; font-weight: 800; }
      .product-frame {
        align-self: center;
        justify-self: end;
        width: 610px;
        height: 590px;
        overflow: hidden;
        border: 1px solid rgba(20, 94, 104, 0.28);
        border-radius: 22px;
        background: white;
        box-shadow: 0 30px 70px rgba(17, 72, 80, 0.2), 0 8px 22px rgba(17, 72, 80, 0.13);
      }
      .product-frame img { display: block; width: 610px; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <div class="brand">
          <img src="../../../floun/public/icons/icon_128.png" alt="" />
          <span>floun</span>
        </div>
        <div class="version">VERSION 2.1</div>
        <h1>See your cryptographic footprint clearly.</h1>
        <p>Scan a page, review migration signals, and export a privacy-safe report.</p>
        <ul>
          <li>JavaScript, tokens, TLS, and certificates</li>
          <li>Redacted PDF reports</li>
          <li>Optional DeepSeek drafting with your API key</li>
        </ul>
      </section>
      <section class="product-frame" aria-label="Floun scanning Cloudflare">
        <img src="./floun-popup-cloudflare.png" alt="Floun scan results" />
      </section>
    </main>
  </body>
</html>
